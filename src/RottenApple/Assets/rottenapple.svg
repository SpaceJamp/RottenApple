<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Parody of a bitten-apple logo: same pose, but rotting, dripping and wormy. -->
  <defs>
    <linearGradient id="rotten" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa63f"/>
      <stop offset="0.5" stop-color="#7a7a2e"/>
      <stop offset="1" stop-color="#5a3c1c"/>
    </linearGradient>
    <linearGradient id="deadleaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8864a"/>
      <stop offset="1" stop-color="#6b4a22"/>
    </linearGradient>
    <mask id="bite">
      <rect width="256" height="256" fill="#fff"/>
      <circle cx="224" cy="126" r="30" fill="#000"/>
    </mask>
  </defs>

  <!-- withered brown leaf -->
  <path d="M132 70 C128 46 140 26 160 18 C164 42 152 62 132 70 Z" fill="url(#deadleaf)" transform="rotate(38 132 70)"/>
  <path d="M132 70 C140 54 146 40 152 28" fill="none" stroke="#4e3418" stroke-width="2" transform="rotate(38 132 70)"/>

  <g mask="url(#bite)">
    <!-- body -->
    <path d="M128 86 C110 74 64 68 46 108 C28 148 48 204 80 226 C96 236 112 230 128 224
             C144 230 160 236 176 226 C204 208 222 170 222 150 C222 120 210 84 186 78 C160 72 144 80 128 86 Z"
          fill="url(#rotten)"/>
    <!-- drips -->
    <path d="M86 224 L86 240 a6 6 0 0 0 12 0 L98 230 Z" fill="#5a3c1c"/>
    <path d="M150 230 L150 246 a5 5 0 0 0 10 0 L160 228 Z" fill="#5a3c1c"/>
    <path d="M116 228 L116 234 a4 4 0 0 0 8 0 L124 226 Z" fill="#5a3c1c"/>
    <!-- mould spots -->
    <circle cx="82" cy="150" r="14" fill="#4a3216" opacity="0.7"/>
    <circle cx="104" cy="190" r="9" fill="#4a3216" opacity="0.6"/>
    <circle cx="160" cy="196" r="12" fill="#4a3216" opacity="0.65"/>
    <circle cx="72" cy="118" r="5" fill="#d8e6a0" opacity="0.6"/>
    <circle cx="96" cy="168" r="4" fill="#d8e6a0" opacity="0.5"/>
    <circle cx="150" cy="120" r="6" fill="#d8e6a0" opacity="0.45"/>
  </g>

  <!-- worm leaving through the bite -->
  <path d="M190 132 C204 128 206 110 222 104" fill="none" stroke="#e58fa0" stroke-width="16" stroke-linecap="round"/>
  <path d="M199 124 l7 9 M209 112 l6 9" stroke="#b8606f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="226" cy="100" r="12" fill="#f0a3b1"/>
  <circle cx="230" cy="96" r="4.5" fill="#fff"/>
  <circle cx="231.5" cy="96" r="2.2" fill="#1b1b1b"/>
  <path d="M220 106 q5 4 10 1" fill="none" stroke="#8a3d4a" stroke-width="2" stroke-linecap="round"/>
</svg>
